name: Mozilla AMO — verify and submit PUBLIC listing

# Manual on purpose. Ordinary commits and merges MUST NOT submit to Mozilla.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release branch to package (must start release/)"
        type: string
        required: true
        default: "release/v0.5.4-review"
      expected_version:
        description: "Version already committed in manifest.json (e.g. 0.5.5)"
        type: string
        required: true
        default: "0.5.5"
      operation:
        description: "Verification only, or submit public listed version for Mozilla review"
        required: true
        type: choice
        options:
          - verify-only
          - submit-listed
        default: verify-only

permissions:
  contents: read

concurrency:
  group: mozilla-listed-${{ inputs.expected_version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release version and produce reviewed packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out selected release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Require approved release branch, same extension ID and exact version
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          branch = os.environ['RELEASE_REF']
          version = os.environ['EXPECTED_VERSION']
          if not re.fullmatch(r'release/[a-zA-Z0-9._/-]+', branch) or '..' in branch:
              raise SystemExit('Ref must be a release/ branch')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or tuple(map(int, version.split('.'))) <= (0, 5, 4):
              raise SystemExit('Release must be a new, numeric version greater than 0.5.4')
          with open('manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          with open('package.json', encoding='utf-8') as f:
              package = json.load(f)
          guid = manifest.get('browser_specific_settings', {}).get('gecko', {}).get('id')
          if guid != 'elf-shell-ayarime@local.theme':
              raise SystemExit('AMO update blocked: original Firefox extension ID changed')
          if manifest.get('version') != version or package.get('version') != version:
              raise SystemExit('Version mismatch: commit and select the SAME new version in manifest and package.json')
          if manifest.get('browser_specific_settings', {}).get('gecko', {}).get('data_collection_permissions') != {'required': ['none']}:
              raise SystemExit('Mozilla data collection declaration changed; review before release')
          print(f'Eligible for public listed update: ELF//SHELL {version} ({guid})')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full source and regression tests
        run: npm test
      - name: Build exact unsigned runtime ZIP
        run: python3 scripts/package.py
      - name: Lint packaged extension for Mozilla
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/amo --warnings-as-errors
      - name: Verify unsigned ZIP matches tracked source
        run: python3 scripts/package.py --verify-only
      - name: Produce Mozilla reviewer source ZIP
        run: npm run package:amo:source
      - name: Rebuild and validate reviewer sources without Git
        run: python3 tests/source_archive_safety.py
      - name: Verify runtime excludes untracked files and rebuilds from source ZIP
        run: python3 tests/runtime_asset_safety.py

      - name: Install release Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install isolated browser testing dependency
        run: python3 -m pip install 'selenium>=4.30,<5'
      - name: Test the Firefox extension in a clean native browser profile
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 tests/native_firefox_smoke.py
      - name: Verify real Firefox permission gesture flow
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 tests/native_firefox_permissions.py

      - name: Validate required PUBLIC listing metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('amo/listing-metadata.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          if obj.get('version', {}).get('license') != 'MPL-2.0':
              raise SystemExit('Missing MPL-2.0 version license')
          if not isinstance(obj.get('summary'), dict) or not obj['summary'].get('en-US'):
              raise SystemExit('Missing localised AMO summary')
          if not isinstance(obj.get('categories'), list) or not set(obj['categories']) <= {'appearance','tabs'} or not obj['categories']:
              raise SystemExit('Invalid AMO public categories')
          print('Verified public listing metadata, categories, licence and summary')
          PY
          cp amo/listing-metadata.json dist/amo-listing-metadata.json

      - name: Preserve verified unsigned and reviewer source archives
        uses: actions/upload-artifact@v4
        with:
          name: elfshell-amo-${{ inputs.expected_version }}
          path: |
            dist/ELF-SHELL-Ayarime-v*-AMO.zip
            dist/ELF-SHELL-Ayarime-v*-source.zip
            dist/amo-listing-metadata.json
          if-no-files-found: error
          retention-days: 30

  submit:
    name: Submit reviewed version for PUBLIC Mozilla listing
    needs: verify
    if: ${{ inputs.operation == 'submit-listed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mozilla-listed
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Download exact package approved by verification job
        uses: actions/download-artifact@v4
        with:
          name: elfshell-amo-${{ inputs.expected_version }}
          path: dist
      - name: Verify package identity after downloading artifacts
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          mkdir -p dist/amo
          unzip -q "dist/ELF-SHELL-Ayarime-v${EXPECTED_VERSION}-AMO.zip" -d dist/amo
          python3 - <<'PY'
          import json, os
          with open('dist/amo/manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          if m.get('version') != os.environ['EXPECTED_VERSION'] or m.get('browser_specific_settings', {}).get('gecko', {}).get('id') != 'elf-shell-ayarime@local.theme':
              raise SystemExit('Refusing to submit: downloaded ZIP identity/version mismatch')
          print('Download and Firefox extension ID checked')
          PY
      - name: Submit a LISTED version to the existing AMO add-on with API v5
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          if [[ -z "${WEB_EXT_API_KEY}" || -z "${WEB_EXT_API_SECRET}" ]]; then
            echo "::error::Configure AMO_JWT_ISSUER and AMO_JWT_SECRET as secrets in GitHub environment mozilla-listed."
            exit 1
          fi
          npx --yes web-ext@10.8.0 sign \
            --source-dir dist/amo \
            --channel listed \
            --amo-metadata dist/amo-listing-metadata.json \
            --upload-source-code "dist/ELF-SHELL-Ayarime-v${EXPECTED_VERSION}-source.zip" \
            --approval-timeout 0 \
            --no-input
          {
            echo "### Mozilla update submitted"
            echo "ELF//SHELL v${EXPECTED_VERSION} was submitted for **public listing** review."
            echo "Mozilla review, signing and public discoverability are NOT confirmed by API acceptance."
            echo "Check [Developer Hub](https://addons.mozilla.org/developers/) for status."
            echo "Check the EXISTING add-on in AMO before retrying. Never create a duplicate extension ID."
          } >> "${GITHUB_STEP_SUMMARY}"
