name: Build native Ayarime Linux spell helper

on:
  pull_request:
    branches: [release/v0.5.6-development]
    paths:
      - "linux-spell/**"
      - "tests/linux_spell_core.py"
      - "tests/linux_spell_deb.py"
      - "tests/linux_spell_runtime_smoke.py"
      - "tests/linux_spell_live_gtk.py"
      - ".github/workflows/native-linux-spell.yml"
      - "LICENSE"
  push:
    branches: [release/v0.5.6-development, feature/linux-native-spell-click-helper]
    paths:
      - "linux-spell/**"
      - "tests/linux_spell_core.py"
      - "tests/linux_spell_deb.py"
      - "tests/linux_spell_runtime_smoke.py"
      - "tests/linux_spell_live_gtk.py"
      - ".github/workflows/native-linux-spell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-spell:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate syntax and pure local word-replacement contract
        run: |
          python3 -m py_compile linux-spell/core.py linux-spell/app.py linux-spell/build_deb.py
          python3 tests/linux_spell_core.py -v
      - name: Install native spell test prerequisites on GitHub runner ONLY
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 \
            python3-enchant hunspell-en-gb at-spi2-core \
            dbus-x11 xvfb xdotool
      - name: Verify real local Enchant dictionary and AT-SPI listener on X11
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/linux_spell_runtime_smoke.py
      - name: Live X11 click-to-correct in synthetic GTK text input
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/linux_spell_live_gtk.py
      - name: Package and inspect zero-service Debian .deb
        run: python3 tests/linux_spell_deb.py
      - name: Upload small, unsigned Linux Mint preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ayarime-linux-spell-mint-preview
          path: dist/linux-spell/ayarime-spell_0.1.0-1_all.deb
          retention-days: 30
          if-no-files-found: error
